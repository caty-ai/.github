# supporter-loop — record-only first; caller activation belongs to checkpoint #4.
# Contract: caty-ai/x-collector docs/supporter-loop/CONTRACT.md v2.0 (frozen)
# SECURITY INVARIANTS — §13, do not weaken:
# 1. Never check out or execute code from the triggering ref, including in callers.
# 2. Actor strings enter scripts only through env or GITHUB_EVENT_PATH.
# 3. Exactly four declared secrets; PATs are step-local, Administration only in act; the
#    stars job references no secret.
# 4. PATs go only to GitHub for the reward repo (except §8.4 read-only scope probes);
#    notification credentials go only to their declared host. Never echo secrets.
#    contents: write on a GITHUB_TOKEN exists only in the sweep-only stars job (v1.11);
#    decide and act are contents: none on every event.
# 5. Record-only's only long-lived credential is Contents-only (cannot invite); the
#    sweep-only stars token is ephemeral, source-repo, one GET, and cannot invite either.
#    act and every outbound call are guarded by live mode; owner notifications are live-only.
# 6. No third-party actions, including code fetched from a triggering ref.
# 7. Supporter output is only invitation, own-thread comments, and SUPPORTERS.md.
# 8. Fixed comment templates: login/reward_repo_url substitutions plus numeric marker.
# Caller concurrency, token registration/expiry variables, baseline JSON and
# the Contributors wall/release notes are owned by child #3 / the owner.
# Backfill is retired in v2.0; historical ok-backfill lines retain their meaning.
name: supporter-loop-reusable
on:
  workflow_call:
    inputs:
      mode:
        description: "record-only | live. Anything else fails the run before any step touches the network."
        required: true
        type: string
      reward_repo:
        description: "owner/name of the private reward repo (ledger + invitations)."
        required: false
        type: string
        default: caty-ai/ask-ai-widget
      tiers_enabled:
        description: "Comma-separated subset of 1,2,3. Events for a disabled tier are ledgered as action=skip result=tier-disabled."
        required: false
        type: string
        default: "1,2,3"
      sweep:
        description: "true only from the scheduled sweep job (§11). Mutually exclusive with a tier event."
        required: false
        type: boolean
        default: false
    secrets:
      SUPPORTER_LEDGER_TOKEN:
        description: "Fine-grained PAT, reward_repo only, Contents R/W (§8). Used by decide (ledger) and act (SUPPORTERS.md). Required in both modes."
        required: true
      SUPPORTER_LOOP_TOKEN:
        description: "Fine-grained PAT, reward_repo only, Administration R/W (§8). Loaded only by the act job; may be left unset until checkpoint #4. act fails loud if empty in live."
        required: false
      TELEGRAM_BOT_TOKEN:
        description: "Owner notification bot (§9)."
        required: true
      TELEGRAM_CHAT_ID:
        description: "Owner notification chat (§9)."
        required: true
permissions: {}
jobs:
  # §4.4 v1.11: the stargazer listing is refused to every credential except a GITHUB_TOKEN with
  # contents: write (caty-ai/.github#89, measured). This sweep-only job is the only holder of that
  # permission in the loop: no secret, no checkout, one paginated GET, numeric ids out. On
  # supporter-facing events it is skipped, so no such token is minted for them.
  stars:
    if: ${{ inputs.sweep == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ok: ${{ steps.list.outputs.ok }}
      stargazers: ${{ steps.list.outputs.stargazers }}
    steps:
      - name: List stargazers of the source repo (ids only)
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/stars"
          mkdir -p "$work"
          ok=true
          # §11(b): every page or nothing; any shape defect fails closed in decide.
          if ! gh api --hostname github.com --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/stargazers?per_page=100" > "$work/pages" \
             || ! jq -e 'type=="array" and length>0 and all(.[]; type=="array") and all(.[][]; .id|type=="number" and .>0 and floor==.)' "$work/pages" >/dev/null; then
            ok=false; printf '[]\n' > "$work/pages"
          fi
          # jq builtin unique_by sorts: the local definition preserves first page occurrence.
          # IDs only, never logins or author text. Fail before GitHub's output-size truncation.
          stars=$(jq -c 'def unique_by(f): reduce .[] as $x ({seen:{},out:[]}; ($x|f|tojson) as $k | if .seen[$k] then . else .seen[$k]=true | .out += [$x] end) | .out; [.[][].id] | unique_by(.)' "$work/pages")
          [ "${#stars}" -lt 400000 ] || { echo '::error::stargazer handoff exceeds safe output size'; exit 1; }
          printf 'ok=%s\n' "$ok" >> "$GITHUB_OUTPUT"
          printf 'stargazers=%s\n' "$stars" >> "$GITHUB_OUTPUT"
  decide:
    needs: stars
    # A skipped stars (non-sweep event) must not skip decide; a failed one is judged by decide.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: none
      actions: read
      issues: read
      pull-requests: read
      discussions: read
    outputs:
      actions: ${{ steps.decide.outputs.actions }}
      has_live_actions: ${{ steps.decide.outputs.has_live_actions }}
      sweep_gate: ${{ steps.decide.outputs.sweep_gate }}
      stargazers: ${{ steps.decide.outputs.stargazers }}
      cancelled_event: ${{ steps.decide.outputs.cancelled_event }}
      cancelled_schedule: ${{ steps.decide.outputs.cancelled_schedule }}
      red_run: ${{ steps.decide.outputs.red_run }}
    steps:
      - name: Validate mode before any network access
        env:
          MODE: ${{ inputs.mode }}
          REWARD_REPO: ${{ inputs.reward_repo }}
          TIERS_ENABLED: ${{ inputs.tiers_enabled }}
          SWEEP: ${{ inputs.sweep }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # jq/GraphQL variables below are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          case "$MODE" in record-only|live) ;; *) echo '::error::invalid mode'; exit 1 ;; esac
          # v1 scope is one reward repository; widening is a contract bump (§8).
          [ "$REWARD_REPO" = caty-ai/ask-ai-widget ] || { echo '::error::reward repo outside v1 scope'; exit 1; }
          [[ "$TIERS_ENABLED" =~ ^[123](,[123])*$ ]] || { echo '::error::invalid tiers'; exit 1; }
          if [ "$SWEEP" = true ]; then
            # v1.11: an owner workflow_dispatch of the caller is a sweep too (§4.3 / §11).
            case "$EVENT_NAME" in schedule|workflow_dispatch) ;; *) echo '::error::sweep is exclusive with tier events'; exit 1 ;; esac
          else
            case "$EVENT_NAME" in watch|issues|discussion|pull_request_target) ;; *) echo '::error::unsupported tier event'; exit 1 ;; esac
          fi
      - name: Decide and append the record-only or skip ledger
        id: decide
        env:
          MODE: ${{ inputs.mode }}
          REWARD_REPO: ${{ inputs.reward_repo }}
          TIERS_ENABLED: ${{ inputs.tiers_enabled }}
          SWEEP: ${{ inputs.sweep }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          LEDGER_TOKEN: ${{ secrets.SUPPORTER_LEDGER_TOKEN }}
          LEDGER_EXPIRES: ${{ vars.SUPPORTER_LEDGER_TOKEN_EXPIRES }}
          STAR_IDS_OK: ${{ needs.stars.outputs.ok }}
          STAR_IDS: ${{ needs.stars.outputs.stargazers }}
        run: |
          # jq/GraphQL variables below are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/supporter-loop"
          mkdir -p "$work"
          base="${GITHUB_REPOSITORY//\//--}"
          ledger="$work/ledger.ndjson"
          # .publication-denylist option a: split committer email preserves contract §6 identity.
          # Model is embedded in the reviewed central workflow, never loaded from source code.
          cat > "$work/model.jq" <<'JQ'
          def success: .result | test("^(ok($|-)|already-|noop$|expired$)");
          def closure: (.action | IN("revoke","would-revoke","cancel-invite","would-cancel-invite")) and success and .result != "expired";
          def generation($repo;$id): 1 + ([.[] | select(.repo==$repo and .actor_id==$id) | select(closure) | .run_id] | unique | length);
          def current($repo;$id): generation($repo;$id) as $g | [.[] | select(.repo==$repo and .actor_id==$id and .gen==$g)];
          def achieved($repo;$id): current($repo;$id) | [.[] | select(success) | select(if $mode=="live" then (.action | IN("invite","comment","supporters-append")) else (.action | IN("would-invite","would-comment","would-supporters-append")) end) | .tier] | max // 0;
          def delivered($repo;$id;$tier;$action): generation($repo;$id) as $g |
            [to_entries[] | .value + {__order:.key} | select(.repo==$repo and .actor_id==$id and .gen==$g)] |
            (if ($action=="invite" or $action=="would-invite") then
              ([.[] | select(.action=="cancel-invite" and .result=="expired") | [.ts,.__order]] | max // ["",-1]) as $expired |
              any(.[]; .tier==$tier and .dedup_key==($repo+":"+($tier|tostring)+":"+($id|tostring)) and .action==$action and success and [.ts,.__order]>$expired)
            else any(.[]; .tier==$tier and .dedup_key==($repo+":"+($tier|tostring)+":"+($id|tostring)) and .action==$action and success) end);
          # Shared key rule: a sweep delivery is a tier delivery, never a closure.
          def key_namespace($action;$event;$tier):
            if $event=="sweep" and ($action|IN("skip","revoke","cancel-invite","would-revoke","would-cancel-invite")) then "sweep" else ($tier|tostring) end;
          def invite_delivered($repo;$id):
            delivered($repo;$id;1;"invite") or
            (if $mode=="record-only" then delivered($repo;$id;1;"would-invite") else false end) or
            (current($repo;$id) | to_entries | map(.value+{__order:.key}) |
              ([.[]|select(.action=="cancel-invite" and .result=="expired")|[.ts,.__order]]|max // ["",-1]) as $expired |
              any(.[]; .action=="invite" and .result=="ok-backfill" and .dedup_key==($repo+":sweep:"+($id|tostring)) and [.ts,.__order]>$expired));
          def append_delivered($repo;$id): delivered($repo;$id;1;"supporters-append") or
            (if $mode=="record-only" then delivered($repo;$id;1;"would-supporters-append") else false end);
          def excluded($repo;$id): current($repo;$id) | any(.[]; .action=="skip" and (.result|startswith("excluded-")));
          def exhausted($repo;$id):
            # Count completed invite/expiry cycles, not concurrent PUTs before one expiry.
            current($repo;$id) | to_entries | unique_by(.value) | sort_by(.value.ts,.key) | map(.value) |
            reduce .[] as $r ({pending:false,expired:0};
              if $r.action=="invite" and ($r.result|IN("ok","ok-backfill","ok-catchup")) then .pending=true
              elif $r.action=="cancel-invite" and $r.result=="expired" and .pending then .expired+=1 | .pending=false else . end) | .expired>=2;
          def catchup($repo;$stars;$tiers): . as $all |
            if ($tiers|split(",")|index("1"))==null then [] else
              [$stars[] as $id | ($all|current($repo;$id)) as $history |
                select(($all|generation($repo;$id))==1 or ($history|length)>0) |
                select($all|excluded($repo;$id)|not) |
                ($all|invite_delivered($repo;$id)) as $invited | ($all|append_delivered($repo;$id)) as $appended |
                select(($invited and $appended)|not) |
                {actor_id:$id,gen:($all|generation($repo;$id)),invite:$invited,append:$appended,
                 actor:($history|sort_by(.ts)|last|.actor // ""),
                 rearmed:($history|any(.[];.action=="invite" and success)),exhausted:($all|exhausted($repo;$id))}] |
              map(select(.rearmed|not)) + map(select(.rearmed)) end;
          # Rolling window is (now-86400, now]: exactly 24h old has aged out.
          # Exact duplicate rotation rows count once; already-1 never consumed a PUT.
          def quota($repo;$pending;$now):
            [unique[] | select(.repo==$repo and .action=="invite" and (.result|IN("ok","ok-backfill","ok-catchup"))) |
              {id:.actor_id,ts:(.ts|fromdateiso8601)} | select(.ts>$now-86400 and .ts<=$now)] as $sent |
            ($sent + [$pending[] | {id:.invitee.id,ts:(.created_at|fromdateiso8601)} |
              select(.ts>$now-86400 and .ts<=$now) | . as $p | select(all($sent[];.id!=$p.id))]) as $counted |
            {B:($counted|length),Q:([0,45-($counted|length)]|max),
             age_out:([$counted[].ts+86400-$now]|min // 0)};
          JQ
          model() { jq -s -L "$work" --arg mode "$MODE" "include \"model\"; $1" "$ledger"; }
          # Read-shaped requests; HTTP errors are classified without printing response bodies.
          get() {
            local token="$1" endpoint="$2" target="$3"
            code=$(curl -sS --connect-timeout 10 --max-time 45 -o "$target" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/$endpoint") || return 1
          }
          pages() {
            local token="$1" endpoint="$2" target="$3"
            GH_TOKEN="$token" gh api --hostname github.com --method GET --paginate --slurp "$endpoint" > "$target.pages" || return 1
            jq -e 'type=="array" and length>0 and all(.[]; type=="array")' "$target.pages" >/dev/null || return 1
            jq 'add // []' "$target.pages" > "$target"
          }
          ledger_directory() {
            get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger" "$work/directory-probe.json" || return 1
            if [ "$code" = 404 ]; then
              echo '::error::reward repo has no ledger/ directory; create ledger/baseline-<date>.json first (contract §5.3 step 1)'
              return 1
            fi
            [ "$code" = 200 ]
          }
          read_ledger() {
            ledger_directory || return 1
            pages "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger?per_page=100" "$work/directory.json" || return 1
            [ "$(jq length "$work/directory.json")" -lt 1000 ] || { echo '::error::ledger directory may be truncated'; return 1; }
            : > "$ledger"
            jq -r --arg base "$base" '[.[] | select(.type=="file" and (.name | startswith($base)) and (.name | endswith(".ndjson")))] | sort_by(.name) | .[].name' "$work/directory.json" > "$work/names"
            while IFS= read -r name; do
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$name" "$work/blob.json" || return 1
              [ "$code" = 200 ] || return 1
              jq -er '.content | gsub("[\\n\\r]"; "") | @base64d' "$work/blob.json" >> "$ledger" || return 1
            done < "$work/names"
            # Unknown fields and schema versions are retained verbatim; nothing rewrites history.
            jq -s -e 'all(.[]; type=="object")' "$ledger" >/dev/null || return 1
            if jq -se 'any(.[]; .schema>1)' "$ledger" >/dev/null; then echo '::warning::higher-schema ledger records preserved verbatim'; fi
          }
          line() {
            local action="$1" result="$2" tier="$3" subject="$4" event="$5"
            jq -cn -L "$work" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "$RUN_KEY" \
              --arg repo "$GITHUB_REPOSITORY" --arg event "$event" --arg actor "$actor" \
              --arg actor_id "$actor_id" --arg tier "$tier" --arg subject "$subject" \
              --arg action "$action" --arg mode "$MODE" --arg result "$result" \
              --arg gen "$gen" \
              'include "model"; key_namespace($action;$event;$tier) as $ns | {schema:1,ts:$ts,run_id:$run_id,repo:$repo,event:$event,actor:$actor,actor_id:($actor_id|tonumber),tier:($tier|tonumber),subject:$subject,action:$action,mode:$mode,result:$result,dedup_key:($repo+":"+$ns+":"+$actor_id),gen:($gen|tonumber)}'
          }
          append() {
            local entry="$1" attempt=0 sha content status
            # Initial attempt plus at most five conflict retries, each re-reading SHA and bytes.
            while [ "$attempt" -le 5 ]; do
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$base.ndjson" "$work/current.json" || return 1
              case "$code" in
                200) sha=$(jq -er .sha "$work/current.json"); jq -jr '.content | gsub("[\\n\\r]"; "") | @base64d' "$work/current.json" > "$work/current.ndjson" ;;
                404) sha=''; : > "$work/current.ndjson" ;;
                *) echo '::error::ledger read failed'; return 1 ;;
              esac
              # Only rejected CAS requests retry; identical sibling skip lines are distinct attempts.
              if [ -s "$work/current.ndjson" ]; then
                [ "$(tail -c 1 "$work/current.ndjson" | od -An -tu1 | tr -d ' ')" = 10 ] || printf '\n' >> "$work/current.ndjson"
              fi
              printf '%s\n' "$entry" >> "$work/current.ndjson"
              content=$(base64 < "$work/current.ndjson" | tr -d '\n')
              jq -cn --arg content "$content" --arg sha "$sha" \
                --arg message "supporter-loop: $(jq -r '.event+" "+.actor+" "+.action' <<< "$entry")" \
                '{message:$message,content:$content,committer:{name:"supporter-loop[bot]",email:("supporter-loop@" + "caty-ai" + ".noreply")}} + (if $sha=="" then {} else {sha:$sha} end)' > "$work/put.json"
              status=$(curl -sS --connect-timeout 10 --max-time 45 -o "$work/put-response.json" -w '%{http_code}' \
                -X PUT -H "Authorization: Bearer $LEDGER_TOKEN" -H 'Accept: application/vnd.github+json' \
                --data-binary @"$work/put.json" "https://api.github.com/repos/$REWARD_REPO/contents/ledger/$base.ndjson") || return 1
              case "$status" in
                200|201) printf '%s\n' "$entry" >> "$ledger"; return 0 ;;
                409) ;;
                422) jq -e '.message | test("sha|does not match";"i")' "$work/put-response.json" >/dev/null || { echo '::error::ledger rejected (non-CAS 422)'; return 1; } ;;
                *) echo "::error::ledger append HTTP $status"; return 1 ;;
              esac
              attempt=$((attempt + 1))
              [ "$attempt" -gt 5 ] || sleep "$((1 + RANDOM % 4))"
            done
            echo '::error::ledger CAS retries exhausted'; return 1
          }
          identity() {
            get "$GH_TOKEN" "user/$actor_id" "$work/identity.json" || { code=transport; return 1; }
            [ "$code" = 200 ] || return 1
            actor=$(jq -er --argjson id "$actor_id" 'select(.id==$id) | .login | select(type=="string" and test("^[A-Za-z0-9-]{1,39}(\\[bot\\])?$"))' "$work/identity.json") || { code=identity; return 1; }
            user_type=$(jq -er '.type|select(type=="string")' "$work/identity.json") || { code=identity; return 1; }
          }
          eligibility() {
            actor_lc=$(printf '%s' "$actor" | tr '[:upper:]' '[:lower:]')
            # Exclusion precedence: later matches win (member > org > self > bot > family).
            reason=''
            # Twin external-input-watch.yml fam_roster: case-insensitive; identical token set.
            # Existing production workflow is intentionally untouched; copied roster is noted in README.
            fam_roster="sho""jikumaru caty2 alec-bridge alpha-mbp-bridge cero-bridge"
            for fam in $fam_roster; do [ "$actor_lc" != "$fam" ] || reason=excluded-family; done
            if [ "$user_type" = Bot ] || [[ "$actor_lc" == *'[bot]' ]]; then reason=excluded-bot; fi
            if [ "$actor_lc" = "$(printf '%s' "${GITHUB_REPOSITORY%/*}" | tr '[:upper:]' '[:lower:]')" ] || [ "$actor_lc" = 'github-actions[bot]' ]; then reason=excluded-self; fi
            [ "$user_type" != Organization ] || reason=excluded-org
            case "$assoc" in OWNER|MEMBER) reason=excluded-member ;; esac
            if [ -z "$reason" ]; then
              if ! { [ "$user_type" = User ] && [[ "$actor" =~ ^[A-Za-z0-9-]{1,39}$ ]]; }; then
                echo '::error::invalid actor type/login'; return 1
              fi
            fi
          }
          # Crash-safe §6.3 copy, verify byte equality, then delete the exact base SHA.
          rotate() {
            local archive target_sha='' base_sha content status
            get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$base.ndjson" "$work/rotation-base.json" || return 1
            [ "$code" != 404 ] || return 0
            [ "$code" = 200 ] || return 1
            jq -jr '.content | gsub("[\\n\\r]"; "") | @base64d' "$work/rotation-base.json" > "$work/rotation-base"
            base_sha=$(jq -er .sha "$work/rotation-base.json")
            archive="$base.$(date -u +%F).ndjson"
            # A previous interrupted copy may be from an earlier date. Resume that copy.
            while IFS= read -r name; do
              [ "$name" != "$base.ndjson" ] || continue
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$name" "$work/copy.json" || return 1
              [ "$code" = 200 ] || return 1
              jq -jr '.content | gsub("[\\n\\r]"; "") | @base64d' "$work/copy.json" > "$work/copy"
              if [ -s "$work/copy" ] && cmp -s "$work/copy" <(head -c "$(wc -c < "$work/copy")" "$work/rotation-base"); then
                archive="$name"; target_sha=$(jq -er .sha "$work/copy.json"); break
              fi
            done < "$work/names"
            if [ -z "$target_sha" ] && [ "$(wc -c < "$work/rotation-base")" -le 900000 ]; then return 0; fi
            if [ -z "$target_sha" ]; then
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$archive" "$work/copy.json" || return 1
              # Never overwrite an unrelated archive on a second rotation the same day.
              [ "$code" = 404 ] || { echo '::error::archive already exists; owner intervention required'; return 1; }
            fi
            content=$(base64 < "$work/rotation-base" | tr -d '\n')
            jq -cn --arg content "$content" --arg sha "$target_sha" \
              '{message:"supporter-loop: sweep ledger rotate",content:$content,committer:{name:"supporter-loop[bot]",email:("supporter-loop@" + "caty-ai" + ".noreply")}} + (if $sha=="" then {} else {sha:$sha} end)' > "$work/rotate.json"
            status=$(curl -sS --connect-timeout 10 --max-time 45 -o "$work/rotate-response" -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $LEDGER_TOKEN" --data-binary @"$work/rotate.json" \
              "https://api.github.com/repos/$REWARD_REPO/contents/ledger/$archive") || return 1
            case "$status" in 200|201) ;; *) return 1 ;; esac
            get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$archive" "$work/verify.json" || return 1
            [ "$code" = 200 ] || return 1
            jq -jr '.content | gsub("[\\n\\r]"; "") | @base64d' "$work/verify.json" > "$work/verified"
            cmp -s "$work/rotation-base" "$work/verified" || { echo '::error::rotation byte verification failed'; return 1; }
            jq -cn --arg sha "$base_sha" '{message:"supporter-loop: sweep ledger rotate",sha:$sha,committer:{name:"supporter-loop[bot]",email:("supporter-loop@" + "caty-ai" + ".noreply")}}' > "$work/delete.json"
            status=$(curl -sS --connect-timeout 10 --max-time 45 -o "$work/delete-response" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $LEDGER_TOKEN" --data-binary @"$work/delete.json" \
              "https://api.github.com/repos/$REWARD_REPO/contents/ledger/$base.ndjson") || return 1
            [ "$status" = 200 ] || { echo '::error::rotation base changed; preserved both copies'; return 1; }
          }
          # GraphQL is read-only here. Explicit cursors exhaust comments AND every replies connection.
          graph() {
            local query="$1" variables="$2" target="$3" entry key value kind
            # Only query operations; gh field flags select POST for GraphQL transport.
            case "$query" in query*) ;; *) return 1 ;; esac
            set --
            while IFS= read -r entry; do
              key=$(jq -r .key <<< "$entry")
              value=$(jq -r .value <<< "$entry")
              kind=$(jq -r '.value|type' <<< "$entry")
              if [ "$kind" = string ]; then set -- "$@" -f "$key=$value"
              else set -- "$@" -F "$key=$value"; fi
            done < <(jq -c 'to_entries[]' <<< "$variables")
            gh api graphql --hostname github.com -f query="query ${query#query}" "$@" > "$target" || return 1
            jq -e '(.errors // [] | length)==0 and .data!=null' "$target" >/dev/null
          }
          discussion_comments() {
            local number="$1" subject="$2" cursor=null node id reply_cursor vars query
            # shellcheck disable=SC2016
            query='query($owner:String!,$name:String!,$number:Int!,$cursor:String){repository(owner:$owner,name:$name){discussion(number:$number){id comments(first:100,after:$cursor){nodes{id body author{login}} pageInfo{hasNextPage endCursor}}}}}'
            while :; do
              vars=$(jq -cn --arg owner "${GITHUB_REPOSITORY%/*}" --arg name "${GITHUB_REPOSITORY#*/}" --argjson number "$number" --argjson cursor "$cursor" '{owner:$owner,name:$name,number:$number,cursor:$cursor}')
              graph "$query" "$vars" "$work/discussion-page.json" || return 1
              jq -e '.data.repository.discussion.comments | (.nodes | type=="array") and (.pageInfo.hasNextPage | type=="boolean")' "$work/discussion-page.json" >/dev/null || return 1
              jq -c --arg subject "$subject" '.data.repository.discussion.comments.nodes[] | {body,author:.author.login,subject}' "$work/discussion-page.json" >> "$work/comments.ndjson"
              jq -r '.data.repository.discussion.comments.nodes[].id' "$work/discussion-page.json" > "$work/comment-ids"
              while IFS= read -r id; do
                reply_cursor=null
                while :; do
                  vars=$(jq -cn --arg id "$id" --argjson cursor "$reply_cursor" '{id:$id,cursor:$cursor}')
                  # shellcheck disable=SC2016
                  graph 'query($id:ID!,$cursor:String){node(id:$id){... on DiscussionComment{replies(first:100,after:$cursor){nodes{body author{login}} pageInfo{hasNextPage endCursor}}}}}' "$vars" "$work/replies.json" || return 1
                  jq -e '.data.node.replies | (.nodes | type=="array") and (.pageInfo.hasNextPage | type=="boolean")' "$work/replies.json" >/dev/null || return 1
                  jq -c --arg subject "$subject" '.data.node.replies.nodes[] | {body,author:.author.login,subject}' "$work/replies.json" >> "$work/comments.ndjson"
                  [ "$(jq -r '.data.node.replies.pageInfo.hasNextPage' "$work/replies.json")" = true ] || break
                  node=$(jq -cer '.data.node.replies.pageInfo.endCursor | select(type=="string" and length>0)' "$work/replies.json") || return 1
                  [ "$node" != "$reply_cursor" ] || return 1
                  reply_cursor="$node"
                done
              done < "$work/comment-ids"
              [ "$(jq -r '.data.repository.discussion.comments.pageInfo.hasNextPage' "$work/discussion-page.json")" = true ] || break
              node=$(jq -cer '.data.repository.discussion.comments.pageInfo.endCursor | select(type=="string" and length>0)' "$work/discussion-page.json") || return 1
              [ "$node" != "$cursor" ] || return 1
              cursor="$node"
            done
          }
          markers() {
            jq -s '[.[] | select(.author=="github-actions[bot]") | . as $comment | .body | scan("<!-- supporter-loop:tier([23]):([0-9]+) -->") | {actor_id:(.[1]|tonumber),tier:(.[0]|tonumber),subject:$comment.subject,author:$comment.author}] | unique' "$work/comments.ndjson" > "$work/markers.json"
          }
          all_markers() {
            local cursor=null next vars
            : > "$work/comments.ndjson"
            pages "$GH_TOKEN" "repos/$GITHUB_REPOSITORY/issues/comments?per_page=100" "$work/issues-comments.json" || return 1
            jq -c '.[] | {body,author:.user.login,subject:(.html_url|split("#")[0])}' "$work/issues-comments.json" >> "$work/comments.ndjson"
            get "$GH_TOKEN" "repos/$GITHUB_REPOSITORY" "$work/source.json" || return 1
            [ "$code" = 200 ] || return 1
            jq -e '.has_discussions|type=="boolean"' "$work/source.json" >/dev/null || return 1
            if [ "$(jq -r .has_discussions "$work/source.json")" = true ]; then
              while :; do
                vars=$(jq -cn --arg owner "${GITHUB_REPOSITORY%/*}" --arg name "${GITHUB_REPOSITORY#*/}" --argjson cursor "$cursor" '{owner:$owner,name:$name,cursor:$cursor}')
                # shellcheck disable=SC2016
                graph 'query($owner:String!,$name:String!,$cursor:String){repository(owner:$owner,name:$name){discussions(first:100,after:$cursor){nodes{number url} pageInfo{hasNextPage endCursor}}}}' "$vars" "$work/discussions.json" || return 1
                jq -e '.data.repository.discussions | (.nodes | type=="array") and (.pageInfo.hasNextPage | type=="boolean")' "$work/discussions.json" >/dev/null || return 1
                jq -r '.data.repository.discussions.nodes[] | [.number,.url] | @tsv' "$work/discussions.json" > "$work/discussion-list"
                while IFS=$'\t' read -r number subject; do discussion_comments "$number" "$subject" || return 1; done < "$work/discussion-list"
                [ "$(jq -r '.data.repository.discussions.pageInfo.hasNextPage' "$work/discussions.json")" = true ] || break
                next=$(jq -cer '.data.repository.discussions.pageInfo.endCursor | select(type=="string" and length>0)' "$work/discussions.json") || return 1
                [ "$cursor" != "$next" ] || return 1
                cursor="$next"
              done
            fi
            markers
          }
          # Baselines are created by the owner at checkpoint #2/#4, never invented here.
          baseline() {
            local name
            name=$(jq -r '[.[] | select(.name | test("^baseline-[0-9]{4}-[0-9]{2}-[0-9]{2}\\.json$"))] | sort_by(.name) | .[0].name // empty' "$work/directory.json")
            [ -n "$name" ] || { echo '::error::owner baseline is missing'; return 1; }
            get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$name" "$work/baseline-blob.json" || return 1
            [ "$code" = 200 ] || return 1
            jq -er '.content | gsub("[\\n\\r]"; "") | @base64d | fromjson | select((.collaborators|type=="array") and (.invitations|type=="array"))' "$work/baseline-blob.json" > "$work/baseline.json"
          }
          reminder() {
            local expiry="$1" label="$2" days
            [ -n "$expiry" ] || { echo "::warning::$label expiry variable missing"; return 0; }
            days=$(( ($(date -u -d "$expiry" +%s) - $(date -u +%s)) / 86400 ))
            if [ "$days" -le 14 ]; then echo "::warning::$label expires within 14 days"; printf '%s\n' "$label expires within 14 days" >> "$work/reminders"; fi
          }
          if [ "$SWEEP" = true ]; then
            # §11 step 1, ledger-token half of §8.4. Negative probes are intentionally reads.
            get "$LEDGER_TOKEN" "repos/$REWARD_REPO" "$work/probe.json"; [ "$code" = 200 ]
            ledger_directory
            get "$LEDGER_TOKEN" "repos/$REWARD_REPO/collaborators?per_page=1" "$work/probe.json"; [ "$code" = 200 ]
            get "$LEDGER_TOKEN" "repos/$REWARD_REPO/invitations" "$work/probe.json"; [ "$code" = 403 ] || { echo '::error::ledger token over-scoped'; exit 1; }
            get "$LEDGER_TOKEN" "repos/$GITHUB_REPOSITORY/invitations" "$work/probe.json"
            case "$code" in 403|404) ;; *) echo '::error::ledger token over-scoped'; exit 1 ;; esac
          fi
          read_ledger
          if [ "$SWEEP" = true ]; then
            gate=true
            # §11(a): all pages, nonempty cutoff, and the 1,000-result API cap fail closed.
            # v1.11: the per-workflow listing, so the cap counts supporter-loop runs only —
            # the repository-wide listing exceeded 1,000 before any sweep had succeeded (caty-ai/.github#89).
            runs() {
              local query="$1" target="$2"
              gh api --hostname github.com --method GET --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/workflows/supporter-loop.yml/runs?per_page=100&$query" > "$target.pages" || return 1
              jq -e 'type=="array" and length>0 and all(.[]; (.total_count|type=="number") and .total_count<1000 and (.workflow_runs|type=="array") and all(.workflow_runs[]; (.path|type=="string") and (.created_at|type=="string")))' "$target.pages" >/dev/null || return 1
              jq '[.[].workflow_runs[] | select(.path==".github/workflows/supporter-loop.yml")]' "$target.pages" > "$target"
            }
            cutoff=''
            if runs 'event=schedule&status=success' "$work/success-runs.json" &&
               runs 'event=workflow_dispatch&status=success' "$work/dispatch-runs.json"; then
              cutoff=$(jq -sr 'add | sort_by(.created_at) | last | .created_at // empty' "$work/success-runs.json" "$work/dispatch-runs.json")
            else gate=false; fi
            if [ -z "$cutoff" ]; then
              if runs '' "$work/all-runs.json"; then cutoff=$(jq -r 'sort_by(.created_at) | first | .created_at // empty' "$work/all-runs.json"); else gate=false; fi
            fi
            if [ -z "$cutoff" ]; then gate=false
            elif ! runs "status=failure&created=%3E%3D$cutoff" "$work/failed-runs.json"; then gate=false
            elif [ "$(jq length "$work/failed-runs.json")" -ne 0 ]; then gate=false; fi
            printf 'red_run=%s\n' "$([ "$gate" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
            # Cancelled runs are observability only: they NEVER change any gate.
            cancelled_event=0; cancelled_schedule=0
            if [ -n "$cutoff" ] && runs "status=cancelled&created=%3E%3D$cutoff" "$work/cancelled-runs.json"; then
              cancelled_event=$(jq '[.[]|select(.event|IN("watch","issues","discussion","pull_request_target"))]|length' "$work/cancelled-runs.json")
              cancelled_schedule=$(jq '[.[]|select(.event|IN("schedule","workflow_dispatch"))]|length' "$work/cancelled-runs.json")
            else echo '::warning::cancelled-run listing unavailable; counts default to zero'; fi
            printf 'cancelled_event=%s\ncancelled_schedule=%s\n' "$cancelled_event" "$cancelled_schedule" >> "$GITHUB_OUTPUT"
            stars_ok=false
            # §11(b): pagination errors do not hide expiry/audit work in live act.
            # v1.11: the list comes from the sweep-only stars job (§4.4) — decide never lists
            # stargazers itself (GITHUB_TOKEN gets 403 without contents: write; caty-ai/.github#89).
            # A skipped/failed handoff or a non-numeric entry fails closed here.
            if [ "$STAR_IDS_OK" = true ] && printf '%s' "$STAR_IDS" | jq -e 'type=="array" and all(.[]; type=="number" and .>0 and floor==.)' >/dev/null 2>&1; then
              stars_ok=true
              printf '%s' "$STAR_IDS" | jq '[.[] | {id: .}]' > "$work/stargazers.json"
            else
              gate=false; printf '[]\n' > "$work/stargazers.json"
            fi
            printf 'sweep_gate=%s\n' "$gate" >> "$GITHUB_OUTPUT"
            # IDs only, never secrets or author text. Fail before GitHub's output-size truncation.
            stars=$(jq -c 'def unique_by(f): reduce .[] as $x ({seen:{},out:[]}; ($x|f|tojson) as $k | if .seen[$k] then . else .seen[$k]=true | .out += [$x] end) | .out; [.[].id] | unique_by(.)' "$work/stargazers.json")
            [ "${#stars}" -lt 400000 ] || { echo '::error::stargazer handoff exceeds safe output size'; exit 1; }
            printf 'stargazers=%s\n' "$stars" >> "$GITHUB_OUTPUT"
            printf 'actions=[]\n' >> "$GITHUB_OUTPUT"
            if [ "$MODE" = live ]; then
              # §4.4 v1.9 handoff: act owns steps 2–7 and preconditions (c)(d)(e).
              printf 'has_live_actions=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'has_live_actions=false\n' >> "$GITHUB_OUTPUT"
            # §11 step 2 is a NO-OP: rehearsal invitations cannot expire or be re-armed.
            # §5.3 reduced audit, step 3: no Administration credential exists in this job.
            baseline
            pages "$LEDGER_TOKEN" "repos/$REWARD_REPO/collaborators?per_page=100" "$work/collaborators.json"
            all_markers
            if ! jq -en --slurpfile actual "$work/collaborators.json" --slurpfile before "$work/baseline.json" \
              '($actual[0]|map(.id)|unique)==($before[0].collaborators|map(.id)|unique)' >/dev/null; then
              echo '::error::reduced-collaborators: baseline differs'; gate=false
            fi
            if [ "$(jq length "$work/markers.json")" -ne 0 ]; then echo '::error::reduced-markers: workflow markers exist'; gate=false; fi
            # §11 step 4, reduced: would-revoke only. No would-invite represents a pending invite.
            if [ "$gate" = true ]; then
              model '[.[].actor_id] | unique' > "$work/ids.json"
              while IFS= read -r actor_id; do
                tier=$(model "achieved(\"$GITHUB_REPOSITORY\";$actor_id)")
                [ "$tier" = 1 ] || continue
                jq -e --argjson id "$actor_id" 'any(.[];.id==$id)' "$work/stargazers.json" >/dev/null && continue
                gen=$(model "generation(\"$GITHUB_REPOSITORY\";$actor_id)")
                actor=$(model "[.[] | select(.repo==\"$GITHUB_REPOSITORY\" and .actor_id==$actor_id)] | sort_by(.ts) | last | .actor" | jq -r .)
                append "$(line would-revoke noop 0 '' sweep)"
              done < <(jq -r '.[]' "$work/ids.json")
            fi
            # §11(4b) rehearsal is gated ONLY by exhaustive stars. Pending quota is
            # unavailable without Administration; B is ledger-only (intentional undercount).
            if [ "$stars_ok" = true ]; then
              jq -s -L "$work" --arg mode "$MODE" --arg repo "$GITHUB_REPOSITORY" --arg tiers "$TIERS_ENABLED" --argjson stars "$stars" \
                'include "model"; catchup($repo;$stars;$tiers)' "$ledger" > "$work/catchup.json"
              rehearsal_count=0
              while IFS= read -r item; do
                actor_id=$(jq -r .actor_id <<< "$item"); actor=$(jq -r .actor <<< "$item"); gen=$(jq -r .gen <<< "$item")
                append "$(line would-supporters-append ok 1 '' sweep)"
              done < <(jq -c '.[]|select(.invite and (.append|not))' "$work/catchup.json")
              while IFS= read -r item; do
                quota=$(jq -s -L "$work" --arg mode "$MODE" --arg repo "$GITHUB_REPOSITORY" --argjson now "$(date -u +%s)" 'include "model"; quota($repo;[];$now)' "$ledger")
                [ "$(jq -r .Q <<< "$quota")" -gt "$rehearsal_count" ] || break
                actor_id=$(jq -r .actor_id <<< "$item"); gen=$(jq -r .gen <<< "$item"); actor=$(jq -r .actor <<< "$item")
                if [ "$(jq -r .exhausted <<< "$item")" = true ]; then append "$(line skip excluded-unresponsive 0 '' sweep)"; continue; fi
                identity; assoc=NONE; eligibility
                if [ -n "$reason" ]; then append "$(line skip "$reason" 0 '' sweep)"; continue; fi
                append "$(line would-invite ok 1 '' sweep)"
                rehearsal_count=$((rehearsal_count+1))
                if [ "$(jq -r .append <<< "$item")" = false ]; then append "$(line would-supporters-append ok 1 '' sweep)"; fi
              done < <(jq -c '.[]|select(.invite|not)' "$work/catchup.json")
            fi
            # §11 steps 5–7: rotate, omit derived-public write, warn on ledger-token expiry.
            rotate
            reminder "$LEDGER_EXPIRES" 'ledger token'
            [ "$gate" = true ] || { echo '::error::sweep preconditions failed; cleanup skipped'; exit 1; }
            exit 0
          fi
          # §0 actor mapping: PR author, NEVER merger/sender. No event body/title is read.
          action=$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")
          case "$EVENT_NAME:$action" in
            watch:started) actor_path='.sender'; tier=1; subject=''; assoc=NONE ;;
            issues:opened) actor_path='.issue.user'; tier=2; subject=$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH"); assoc=$(jq -r '.issue.author_association' "$GITHUB_EVENT_PATH") ;;
            discussion:created) actor_path='.discussion.user'; tier=2; subject=$(jq -r '.discussion.html_url' "$GITHUB_EVENT_PATH"); assoc=$(jq -r '.discussion.author_association' "$GITHUB_EVENT_PATH") ;;
            pull_request_target:closed)
              actor_path='.pull_request.user'; tier=3; subject=$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH"); assoc=$(jq -r '.pull_request.author_association' "$GITHUB_EVENT_PATH")
              [ "$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")" = true ] || tier=0 ;;
            *) echo '::error::unsupported event action'; exit 1 ;;
          esac
          actor=$(jq -r "$actor_path.login" "$GITHUB_EVENT_PATH")
          actor_id=$(jq -er "$actor_path.id | select(type==\"number\" and .>0 and floor==.)" "$GITHUB_EVENT_PATH")
          user_type=$(jq -r "$actor_path.type" "$GITHUB_EVENT_PATH")
          eligibility
          gen=$(model "generation(\"$GITHUB_REPOSITORY\";$actor_id)")
          if [ -n "$reason" ]; then
            append "$(line skip "$reason" 0 "$subject" "$EVENT_NAME")"
            printf 'actions=[]\nhas_live_actions=false\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$tier" = 0 ]; then
            append "$(line skip noop 0 "$subject" "$EVENT_NAME")"
            printf 'actions=[]\nhas_live_actions=false\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          case ",$TIERS_ENABLED," in
            *",$tier,"*) ;;
            *) append "$(line skip tier-disabled "$tier" "$subject" "$EVENT_NAME")"; printf 'actions=[]\nhas_live_actions=false\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # §2 cumulative entitlement; only the triggering tier controls disabled-event exclusion.
          # Exactly one derived-file attempt per actor/key, even for direct tier-3 arrival (§6.5).
          candidates=$(jq -cn --argjson tier "$tier" '[{action:"invite",tier:1}] + [range(2;$tier+1) | {action:"comment",tier:.}] + [{action:"supporters-append",tier:$tier}]')
          : > "$work/actions.ndjson"
          while IFS= read -r item; do
            delivery_action=$(jq -r .action <<< "$item")
            delivery_tier=$(jq -r .tier <<< "$item")
            vocabulary="$delivery_action"; [ "$MODE" != record-only ] || vocabulary="would-$delivery_action"
            if [ "$(model "delivered(\"$GITHUB_REPOSITORY\";$actor_id;$delivery_tier;\"$vocabulary\")")" = true ]; then
              append "$(line skip "already-$delivery_tier" "$delivery_tier" "$subject" "$EVENT_NAME")"
            elif [ "$MODE" = record-only ]; then
              append "$(line "$vocabulary" ok "$delivery_tier" "$subject" "$EVENT_NAME")"
            else
              jq -cn --argjson item "$item" --arg actor "$actor" --arg actor_id "$actor_id" --arg gen "$gen" --arg subject "$subject" --arg event "$EVENT_NAME" \
                '$item+{actor:$actor,actor_id:($actor_id|tonumber),gen:($gen|tonumber),subject:$subject,event:$event}' >> "$work/actions.ndjson"
            fi
          done < <(jq -c '.[]' <<< "$candidates")
          actions=$(jq -sc . "$work/actions.ndjson")
          printf 'actions=%s\n' "$actions" >> "$GITHUB_OUTPUT"
          printf 'has_live_actions=%s\n' "$(jq 'length>0' <<< "$actions")" >> "$GITHUB_OUTPUT"
  act:
    needs: decide
    if: ${{ inputs.mode == 'live' && (needs.decide.outputs.has_live_actions == 'true' || inputs.sweep == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: none
      issues: write
      pull-requests: write
      discussions: write
    steps:
      - name: Token preflight before every live leg
        id: preflight
        env:
          MODE: ${{ inputs.mode }}
          REWARD_REPO: ${{ inputs.reward_repo }}
          ADMIN_TOKEN: ${{ secrets.SUPPORTER_LOOP_TOKEN }}
        run: |
          # jq/GraphQL variables below are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          [ "$MODE" = live ] || exit 1
          [ -n "$ADMIN_TOKEN" ] || { echo '::error::SUPPORTER_LOOP_TOKEN is empty'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/supporter-loop"
          date -u +%s > "$RUNNER_TEMP/supporter-loop/job-start"
          probe() {
            [ "$MODE" = live ] || return 1
            code=$(curl -sS --connect-timeout 10 --max-time 45 -o "$RUNNER_TEMP/supporter-loop/preflight.json" -w '%{http_code}' \
              -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/$1")
          }
          # §8.4 loop-token half; this is sweep precondition (c).
          probe "repos/$REWARD_REPO/invitations"
          [ "$code" = 200 ] || { echo '::error::Administration preflight failed'; exit 1; }
          probe "repos/$REWARD_REPO/contents/ledger"
          case "$code" in 403|404) ;; *) echo '::error::token over-scoped: Contents'; exit 1 ;; esac
          # Explicit, read-shaped source-repository over-scope probe (§8.4 exception).
          probe "repos/$GITHUB_REPOSITORY/invitations"
          case "$code" in 403|404) ;; *) echo '::error::token over-scoped: source'; exit 1 ;; esac
          # Reachability only. The `permissions` object of GET /repos reflects the token
          # owner's repository role (an org owner always sees push=true), not the
          # fine-grained grant; the Contents 403/404 probe above is the push-impossibility
          # proof (§8.4, v1.10 — caty-ai/.github#85).
          probe "repos/$REWARD_REPO"
          [ "$code" = 200 ] || { echo '::error::reward repo preflight failed'; exit 1; }
      - name: Execute live actions and sweep after preflight
        id: deliver
        if: ${{ steps.preflight.outcome == 'success' }}
        env:
          MODE: ${{ inputs.mode }}
          REWARD_REPO: ${{ inputs.reward_repo }}
          SWEEP: ${{ inputs.sweep }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          LEDGER_TOKEN: ${{ secrets.SUPPORTER_LEDGER_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.SUPPORTER_LOOP_TOKEN }}
          ACTIONS: ${{ needs.decide.outputs.actions }}
          SWEEP_GATE: ${{ needs.decide.outputs.sweep_gate }}
          STARGAZERS: ${{ needs.decide.outputs.stargazers }}
          TIERS_ENABLED: ${{ inputs.tiers_enabled }}
          CANCELLED_EVENT: ${{ needs.decide.outputs.cancelled_event }}
          CANCELLED_SCHEDULE: ${{ needs.decide.outputs.cancelled_schedule }}
          RED_RUN: ${{ needs.decide.outputs.red_run }}
          LEDGER_EXPIRES: ${{ vars.SUPPORTER_LEDGER_TOKEN_EXPIRES }}
          ADMIN_EXPIRES: ${{ vars.SUPPORTER_LOOP_TOKEN_EXPIRES }}
        run: |
          # jq/GraphQL variables below are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/supporter-loop"
          mkdir -p "$work"
          base="${GITHUB_REPOSITORY//\//--}"
          ledger="$work/ledger.ndjson"
          # §11 work deadline includes preflight. Tests can inject an epoch clock file.
          started=$(date -u +%s)
          if [ -f "$work/job-start" ]; then started=$(cat "$work/job-start"); fi
          elapsed_offset=$(( $(date -u +%s) - started )); SECONDS=0
          writeCount=0; reservedCount=0; waitCount=0; budget_active=false
          if [ "$SWEEP" = true ]; then reservedCount=2; fi # final projection + state
          elapsed() {
            if [ -n "${SWEEP_CLOCK_FILE:-}" ]; then echo "$(( $(cat "$SWEEP_CLOCK_FILE") - started ))"
            else echo "$((elapsed_offset + SECONDS))"; fi
          }
          within_deadline() { [ "$(elapsed)" -le 360 ]; }
          work_budget() { within_deadline && [ "$((writeCount + reservedCount + ${1:-0}))" -le 150 ]; }
          pace_write() {
            # Full second after the previous attempted write completed, even across helpers.
            if [ "$writeCount" -gt 0 ]; then sleep 1; fi
            writeCount=$((writeCount+1))
          }
          # .publication-denylist option a: split committer email preserves contract §6 identity.
          # Model is embedded in the reviewed central workflow, never loaded from source code.
          cat > "$work/model.jq" <<'JQ'
          def success: .result | test("^(ok($|-)|already-|noop$|expired$)");
          def closure: (.action | IN("revoke","would-revoke","cancel-invite","would-cancel-invite")) and success and .result != "expired";
          def generation($repo;$id): 1 + ([.[] | select(.repo==$repo and .actor_id==$id) | select(closure) | .run_id] | unique | length);
          def current($repo;$id): generation($repo;$id) as $g | [.[] | select(.repo==$repo and .actor_id==$id and .gen==$g)];
          def achieved($repo;$id): current($repo;$id) | [.[] | select(success) | select(if $mode=="live" then (.action | IN("invite","comment","supporters-append")) else (.action | IN("would-invite","would-comment","would-supporters-append")) end) | .tier] | max // 0;
          def delivered($repo;$id;$tier;$action): generation($repo;$id) as $g |
            [to_entries[] | .value + {__order:.key} | select(.repo==$repo and .actor_id==$id and .gen==$g)] |
            (if ($action=="invite" or $action=="would-invite") then
              ([.[] | select(.action=="cancel-invite" and .result=="expired") | [.ts,.__order]] | max // ["",-1]) as $expired |
              any(.[]; .tier==$tier and .dedup_key==($repo+":"+($tier|tostring)+":"+($id|tostring)) and .action==$action and success and [.ts,.__order]>$expired)
            else any(.[]; .tier==$tier and .dedup_key==($repo+":"+($tier|tostring)+":"+($id|tostring)) and .action==$action and success) end);
          # Shared key rule: a sweep delivery is a tier delivery, never a closure.
          def key_namespace($action;$event;$tier):
            if $event=="sweep" and ($action|IN("skip","revoke","cancel-invite","would-revoke","would-cancel-invite")) then "sweep" else ($tier|tostring) end;
          def invite_delivered($repo;$id):
            delivered($repo;$id;1;"invite") or
            (if $mode=="record-only" then delivered($repo;$id;1;"would-invite") else false end) or
            (current($repo;$id) | to_entries | map(.value+{__order:.key}) |
              ([.[]|select(.action=="cancel-invite" and .result=="expired")|[.ts,.__order]]|max // ["",-1]) as $expired |
              any(.[]; .action=="invite" and .result=="ok-backfill" and .dedup_key==($repo+":sweep:"+($id|tostring)) and [.ts,.__order]>$expired));
          def append_delivered($repo;$id): delivered($repo;$id;1;"supporters-append") or
            (if $mode=="record-only" then delivered($repo;$id;1;"would-supporters-append") else false end);
          def excluded($repo;$id): current($repo;$id) | any(.[]; .action=="skip" and (.result|startswith("excluded-")));
          def exhausted($repo;$id):
            # Count completed invite/expiry cycles, not concurrent PUTs before one expiry.
