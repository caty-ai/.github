              --arg actor_id "$actor_id" --arg tier "$tier" --arg subject "$subject" \
              --arg action "$action" --arg mode "$MODE" --arg result "$result" \
              --arg dedup_key "$key" --arg gen "$gen" \
              '{schema:1,ts:$ts,run_id:$run_id,repo:$repo,event:$event,actor:$actor,actor_id:($actor_id|tonumber),tier:($tier|tonumber),subject:$subject,action:$action,mode:$mode,result:$result,dedup_key:$dedup_key,gen:($gen|tonumber)}'
          }
          append() {
            local entry="$1" attempt=0 sha content status
            # Initial attempt plus at most five conflict retries, each re-reading SHA and bytes.
            while [ "$attempt" -le 5 ]; do
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$base.ndjson" "$work/current.json" || return 1
              case "$code" in
                200) sha=$(jq -er .sha "$work/current.json"); jq -jr '.content | @base64d' "$work/current.json" > "$work/current.ndjson" ;;
                404) sha=''; : > "$work/current.ndjson" ;;
