              if ! identity; then result="error-$code"; return 0; fi
            fi
            if ! get "$ADMIN_TOKEN" "repos/$REWARD_REPO/collaborators/$actor" "$work/collaborator.json"; then result=error-transport; return 0; fi
            collaborator_status="$code"
            case "$collaborator_status" in 204|404) ;; *) result="error-$code"; return 0 ;; esac
            if ! pages "$ADMIN_TOKEN" "repos/$REWARD_REPO/invitations?per_page=100" "$work/pending.json"; then result=error-preflight; return 0; fi
            if ! jq -e 'all(.[]; (.id|type=="number" and .>0 and floor==.) and (.invitee.id|type=="number" and .>0 and floor==.))' "$work/pending.json" >/dev/null; then result=error-preflight; return 0; fi
            pending=$(jq --argjson id "$actor_id" 'any(.[];.invitee.id==$id)' "$work/pending.json")
            if [ "$collaborator_status" = 204 ] || [ "$pending" = true ]; then result=already-1; return 0; fi
            # Recompute immediately before every catch-up PUT, after fresh pending preflight.
            if [ "$SWEEP" = true ]; then
              if quota_room; then :; else
                case "$?" in 1) result=budget-stop ;; *) result=error-quota ;; esac
                return 0
              fi
            fi
            # §2: explicit REST enum pull; omitting this grants push by platform default.
            printf '{"permission":"pull"}\n' > "$work/invite.json"
            mutate "$ADMIN_TOKEN" PUT "repos/$REWARD_REPO/collaborators/$actor" "$work/invite.json"
            case "$code" in
              200|201|204) result=ok ;;
              422) if invitation_limit; then result=deferred-quota; else result=error-422; fi ;;
              *) result="error-$code" ;;
            esac
          }
          comment() {
            local tier="$1" subject="$2" event="$3" number marker body template node vars query matched
            result=ok
            number="${subject##*/}"
            [[ "$number" =~ ^[0-9]+$ ]] || { result=error-subject; return 0; }
            case "$subject" in "https://github.com/$GITHUB_REPOSITORY/issues/$number"|"https://github.com/$GITHUB_REPOSITORY/pull/$number"|"https://github.com/$GITHUB_REPOSITORY/discussions/$number") ;; *) result=error-subject; return 0 ;; esac
            marker="<!-- supporter-loop:tier$tier:$actor_id -->"
            : > "$work/comments.ndjson"
            if [ "$event" = discussion ]; then
              if ! discussion_comments "$number" "$subject"; then result=error-marker-read; return 0; fi
              node=$(jq -er '.data.repository.discussion.id' "$work/discussion-page.json") || { result=error-marker-read; return 0; }
            else
              if ! pages "$GH_TOKEN" "repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100" "$work/target-comments.json"; then result=error-marker-read; return 0; fi
              jq -c --arg subject "$subject" '.[] | {body,author:.user.login,subject}' "$work/target-comments.json" >> "$work/comments.ndjson"
            fi
            if ! jq -se 'all(.[];.body|type=="string")' "$work/comments.ndjson" >/dev/null; then result=error-marker-parse; return 0; fi
            matched=$(jq -s --arg marker "$marker" 'any(.[];.author=="github-actions[bot]" and (.body|contains($marker)))' "$work/comments.ndjson") || { result=error-marker-parse; return 0; }
            if [ "$matched" = true ]; then result="already-$tier"; return 0; fi
            # Templates are data from central protected main, never the caller/triggering ref.
            # Central main is merge-only via reviewed PR (§4.3); wording approval is checkpoint #4.
            [ "$MODE" = live ] || return 1
            code=$(curl -sS --connect-timeout 10 --max-time 45 -o "$work/template.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/caty-ai/.github/contents/supporter-loop/comment-tier$tier.md?ref=main") || { result=error-template; return 0; }
            [ "$code" = 200 ] || { result="error-$code"; return 0; }
            template=$(jq -er '.content | gsub("[\\n\\r]"; "") | @base64d' "$work/template.json") || { result=error-template; return 0; }
            body=$(jq -nr --arg template "$template" --arg login "$actor" --arg id "$actor_id" --arg url "https://github.com/$REWARD_REPO" \
              '$template | split("{{login}}")|join($login)|split("{{actor_id}}")|join($id)|split("{{reward_repo_url}}")|join($url)')
            [ "${body%%$'\n'*}" = "$marker" ] || { result=error-template-marker; return 0; }
            if [ "$event" = discussion ]; then
              # shellcheck disable=SC2016
              query='mutation($id:ID!,$body:String!){addDiscussionComment(input:{discussionId:$id,body:$body}){comment{id}}}'
              vars=$(jq -cn --arg id "$node" --arg body "$body" '{id:$id,body:$body}')
              jq -cn --arg query "$query" --argjson variables "$vars" '{query:$query,variables:$variables}' > "$work/comment.json"
              mutate "$GH_TOKEN" POST graphql "$work/comment.json"
              if [ "$code" = 200 ] && jq -e '(.errors // []|length)==0 and .data.addDiscussionComment.comment.id!=null' "$work/mutation.json" >/dev/null; then result=ok; else result="error-$code"; fi
            else
              jq -cn --arg body "$body" '{body:$body}' > "$work/comment.json"
              mutate "$GH_TOKEN" POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" "$work/comment.json"
              case "$code" in 200|201) result=ok ;; *) result="error-$code" ;; esac
            fi
          }
          regenerate() {
            local attempt=0 sha content header projected="${1:-}" original_ledger="$ledger"
            local ledger="$work/fresh-ledger.ndjson" derive="$work/projected.ndjson"
            [ "$MODE" = live ] || return 1
            # §6.5: child #1 owns the header; never publish a headerless projection.
            if ! get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/SUPPORTERS.header.md" "$work/supporters-header.json" ||
              [ "$code" != 200 ] ||
              ! header=$(jq -er '.content | select(type=="string" and length>0)' "$work/supporters-header.json" | base64 -d) ||
              [ -z "$header" ] || [ "${header##*$'\n'}" != '<!-- generated table below; do not edit by hand -->' ]; then
              echo '::error::SUPPORTERS.header.md missing or malformed in reward repo (child #1); regeneration skipped'
              return 1
            fi
            while [ "$attempt" -le 5 ]; do
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/SUPPORTERS.md" "$work/supporters.json" || return 1
              case "$code" in 200) sha=$(jq -er .sha "$work/supporters.json") ;; 404) sha='' ;; *) return 1 ;; esac
              # §6.5 CAS restart starts at GET, then reads fresh API ledger before rendering.
              read_ledger || { code="ledger-read"; return 1; }
              cp "$ledger" "$original_ledger" || return 1
              # Command substitution strips only trailing LF bytes; restore one plus the separator.
              printf '%s\n\n' "$header" > "$work/SUPPORTERS.md" || return 1
              # Project only the intended success into a temporary render input.
              # The actual ledger still changes only AFTER the Contents API returns.
              cat "$ledger" > "$derive" || return 1
              if [ -n "$projected" ]; then printf '%s\n' "$projected" >> "$derive"; fi
              # §6.5: stable numeric identity, latest login, achieved success tier, first date.
              # This is a whole-file derivation; the reward-repo child owns its presentation.
              jq -sr -L "$work" --arg mode "$MODE" --arg repo "$GITHUB_REPOSITORY" '
                include "model";
                . as $all | [.[]|select(.repo==$repo)|.actor_id]|unique |
                map(. as $id | ($all|current($repo;$id)) as $history | ($all|achieved($repo;$id)) as $tier |
                  select($tier>0 and ($tier>1 or ($all|invite_delivered($repo;$id)))) | ($all|map(select(.repo==$repo and .actor_id==$id))|sort_by(.ts)) as $ever |
                  {id:$id,actor:($ever|last|.actor),tier:$tier,date:($ever|first|.ts|split("T")[0])}) |
                map(select((.actor|ascii_downcase) as $a | (["sho"+"jikumaru","caty2","alec-bridge","alpha-mbp-bridge","cero-bridge","github-actions[bot]"]|index($a))==null and ($a|endswith("[bot]")|not))) |
                sort_by(.date,.id) | "| Supporter | Tier | Since |\n| --- | --- | --- |", (.[]|"| @\(.actor) | \(.tier) | \(.date) |")' "$derive" >> "$work/SUPPORTERS.md" || return 1
              content=$(base64 < "$work/SUPPORTERS.md" | tr -d '\n')
              jq -cn --arg sha "$sha" --arg content "$content" '{message:"supporter-loop: regenerate supporters",content:$content,committer:{name:"supporter-loop[bot]",email:("supporter-loop@" + "caty-ai" + ".noreply")}}+(if $sha=="" then {} else {sha:$sha} end)' > "$work/supporters-put.json"
              mutate "$LEDGER_TOKEN" PUT "repos/$REWARD_REPO/contents/SUPPORTERS.md" "$work/supporters-put.json"
              case "$code" in 200|201) return 0 ;; 409) ;; 422) jq -e '.message|test("sha|does not match";"i")' "$work/mutation.json" >/dev/null || return 1 ;; *) return 1 ;; esac
              attempt=$((attempt+1)); [ "$attempt" -gt 5 ] || sleep "$((1+RANDOM%4))"
            done
            return 1
          }
          sweep_state() {
            local attempt=0 sha content previous current backlog stars_count md_bytes B state_path
            state_path="ledger/$base.sweep-state.json"
            while [ "$attempt" -le 5 ]; do
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/$state_path" "$work/state-blob.json" || return 1
              case "$code" in
                200) sha=$(jq -er .sha "$work/state-blob.json") || return 1
                     previous=$(jq -er '.content|gsub("[\\n\\r]"; "") | @base64d|fromjson|.alarm_state|select(type=="object")' "$work/state-blob.json" 2>/dev/null) || previous='{}' ;;
                404) sha=''; previous='{}' ;;
                *) return 1 ;;
              esac
              read_ledger || return 1
              candidates_now > "$work/backlog.json" || return 1
              backlog=$(jq length "$work/backlog.json")
              stars_count=$(jq length <<< "$STARGAZERS")
              # Measure the actual published projection, not a failed render.
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/SUPPORTERS.md" "$work/published-supporters.json" || return 1
              case "$code" in
                200) md_bytes=$(jq -er '.size|select(type=="number")' "$work/published-supporters.json") || return 1 ;;
                404) md_bytes=0 ;;
                *) return 1 ;;
              esac
              quota_now || return 1
              B=$(jq -r .B "$work/quota.json")
              jq -cn --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson backlog "$backlog" \
                --argjson events "${CANCELLED_EVENT:-0}" --argjson schedules "${CANCELLED_SCHEDULE:-0}" \
                --argjson stars "$stars_count" --argjson bytes "$md_bytes" --argjson B "$B" \
                --argjson red "${RED_RUN:-false}" --argjson deferred "$deferred_quota" '
                {stars:($stars/40000),supporters_md:($bytes/1048576),invitations:($B/45)} as $capacity |
                {schema:1,last_sweep_ts:$ts,backlog:$backlog,cancelled_runs:{event:$events,schedule:$schedules},capacity_pct:$capacity,
                 alarm_state:{stars_70:($capacity.stars>=0.7),supporters_md_70:($capacity.supporters_md>=0.7),
                   invitations_backlog:($backlog>0),red_run:$red,deferred_quota:$deferred}}' > "$work/sweep-state.json" || return 1
              # Prepare the independent notification leg even if state PUT ultimately fails.
              jq -r --arg repo "$GITHUB_REPOSITORY" --slurpfile entries "$work/notify.ndjson" '
                (.capacity_pct|to_entries|max_by(.value)) as $max |
                ([$entries[]|select(.event=="sweep" and (.action|IN("invite","supporters-append")) and (.result|IN("ok","ok-catchup","already-1")))|.actor_id]|unique|length) as $delivered |
                ([$entries[]|select(.event=="sweep" and (.action|IN("revoke","cancel-invite")) and (.result|IN("ok","noop")))]|length) as $revoked |
                "supporter-loop [live] \($repo) · sweep · delivered \($delivered) · backlog \(.backlog) · cancelled runs \(.cancelled_runs.event)/\(.cancelled_runs.schedule) · capacity \(($max.value*100)|ceil)% of \($max.key) · revoked \($revoked)"' "$work/sweep-state.json" > "$work/sweep-messages" || return 1
              current=$(jq -c .alarm_state "$work/sweep-state.json")
              jq -nr --arg repo "$GITHUB_REPOSITORY" --argjson previous "$previous" --argjson current "$current" '
                $current|to_entries[]|select(.value!=($previous[.key] // false)) |
                "supporter-loop [live] \($repo) · \(.key) · \(if .value then "raised" else "cleared" end)"' >> "$work/sweep-messages" || return 1
              echo "::notice::catch-up backlog=$backlog"
              content=$(base64 < "$work/sweep-state.json" | tr -d '\n')
              jq -cn --arg sha "$sha" --arg content "$content" '{message:"supporter-loop: sweep state",content:$content,committer:{name:"supporter-loop[bot]",email:("supporter-loop@" + "caty-ai" + ".noreply")}}+(if $sha=="" then {} else {sha:$sha} end)' > "$work/state-put.json"
              mutate "$LEDGER_TOKEN" PUT "repos/$REWARD_REPO/contents/$state_path" "$work/state-put.json"
              case "$code" in 200|201) return 0 ;; 409) ;; 422) jq -e '.message|test("sha|does not match";"i")' "$work/mutation.json" >/dev/null || return 1 ;; *) return 1 ;; esac
              attempt=$((attempt+1)); [ "$attempt" -gt 5 ] || sleep "$((1+RANDOM%4))"
            done
            return 1
          }
          read_ledger
          if [ "$SWEEP" != true ]; then
            invite_failure=''
            while IFS= read -r item; do
              actor=$(jq -r .actor <<< "$item"); actor_id=$(jq -r .actor_id <<< "$item"); gen=$(jq -r .gen <<< "$item")
              tier=$(jq -r .tier <<< "$item"); subject=$(jq -r .subject <<< "$item"); event=$(jq -r .event <<< "$item"); action=$(jq -r .action <<< "$item")
              # Invitation failure gates sibling comments and derived-file writes (§14).
              if [ -n "$invite_failure" ]; then emit "$action" "$invite_failure" "$tier" "$subject" "$event"; continue; fi
              case "$action" in
                invite)
                  invite
                  emit invite "$result" "$tier" "$subject" "$event"
                  case "$result" in deferred-quota) invite_failure="$result" ;; error-*) invite_failure="$result"; failed=1 ;; *) changed=true ;; esac ;;
                comment)
                  comment "$tier" "$subject" "$event"
                  emit comment "$result" "$tier" "$subject" "$event"
                  case "$result" in error-*) failed=1 ;; *) changed=true ;; esac ;;
                supporters-append)
                  if regenerate "$(line supporters-append ok "$tier" "$subject" "$event")"; then result=ok; else result="error-$code"; failed=1; fi
                  emit supporters-append "$result" "$tier" "$subject" "$event" ;;
                *) echo '::error::unexpected live plan action'; exit 1 ;;
              esac
            done < <(jq -c '.[]' <<< "$ACTIONS")
            # A re-armed invitation may have no pending supporters-append sibling.
            # Regeneration emits no extra ledger line unless it was an actual planned attempt.
            if [ "$changed" = true ] && [ -z "$invite_failure" ] && ! jq -e 'any(.[];.action=="supporters-append")' <<< "$ACTIONS" >/dev/null; then regenerate || failed=1; fi
            [ "$failed" -eq 0 ] || { echo '::error::one or more live actions failed'; exit 1; }
            exit 0
          fi
          sweep_cleanup() {
            # §11 step 2 (ungated, ledger only): expire the invite delivery, not its generation.
            # Preflight (c) already passed; negative (a)/(b) still permits recovery and audit.
            gate="$SWEEP_GATE"
            audit_complete=false
            : > "$work/cancel-queue.ndjson"
            pages "$LEDGER_TOKEN" "repos/$REWARD_REPO/collaborators?per_page=100" "$work/collaborators.json" || return 1
            pages "$ADMIN_TOKEN" "repos/$REWARD_REPO/invitations?per_page=100" "$work/pending.json" || return 1
            jq -e 'all(.[];.id|type=="number" and .>0 and floor==.)' "$work/collaborators.json" >/dev/null || return 1
            jq -e 'all(.[]; (.id|type=="number" and .>0 and floor==.) and (.invitee.id|type=="number" and .>0 and floor==.))' "$work/pending.json" >/dev/null || return 1
            model '[.[].actor_id]|unique' > "$work/ids.json"
            while IFS= read -r actor_id; do
              if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
              gen=$(model "generation(\"$GITHUB_REPOSITORY\";$actor_id)")
              [ "$(model "achieved(\"$GITHUB_REPOSITORY\";$actor_id)")" -gt 0 ] || continue
              recent=$(model "current(\"$GITHUB_REPOSITORY\";$actor_id)|[.[]|select(.action==\"invite\" and success)]|sort_by(.ts)|last")
              [ "$recent" != null ] || continue
              # Already re-armed invitations are not re-armed on every weekly sweep.
              [ "$(model "delivered(\"$GITHUB_REPOSITORY\";$actor_id;1;\"invite\")")" = true ] || continue
              invited=$(jq -r .ts <<< "$recent")
              [ $(( $(date -u +%s) - $(date -u -d "$invited" +%s) )) -gt 604800 ] || continue
              jq -e --argjson id "$actor_id" 'any(.[];.id==$id)' "$work/collaborators.json" >/dev/null && continue
              actor=$(jq -r .actor <<< "$recent")
              pending=$(jq -c --argjson id "$actor_id" '[.[]|select(.invitee.id==$id)]' "$work/pending.json")
              if [ "$(jq length <<< "$pending")" = 0 ]; then
                emit cancel-invite expired 0 '' sweep; changed=true
              else
                # Only genuinely old pending entries are defensive candidates; a new invite
                # created manually or by a recovered run is never cancelled on an old timestamp.
                while IFS= read -r invitation; do
                  if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
                  created=$(jq -r .created_at <<< "$invitation")
                  if [ $(( $(date -u +%s) - $(date -u -d "$created" +%s) )) -gt 604800 ]; then
                    jq -cn --arg actor "$actor" --argjson id "$actor_id" --argjson gen "$gen" --argjson invitation "$invitation" '{actor:$actor,actor_id:$id,gen:$gen,invitation_id:$invitation.id}' >> "$work/cancel-queue.ndjson"
                  fi
                done < <(jq -c '.[]' <<< "$pending")
              fi
            done < <(jq -r '.[]' "$work/ids.json")
            # §11 step 3: exact set-based audit after re-arm; baseline and manual allowlists.
            baseline || return 1
            all_markers || return 1
            for allow in manual-allowlist manual-markers-allowlist; do
              get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$allow.json" "$work/allow-blob.json" || return 1
              case "$code" in
                200) jq -er '.content|gsub("[\\n\\r]"; "") | @base64d|fromjson|select(type=="array")' "$work/allow-blob.json" > "$work/$allow.json" ;;
                404) printf '[]\n' > "$work/$allow.json" ;;
                *) echo '::error::manual allowlist unreadable'; return 1 ;;
              esac
            done
            : > "$work/threads.ndjson"
            jq -sr '[.[]|select(.action=="comment")|.subject]|unique|.[]' "$ledger" > "$work/subjects"
            while IFS= read -r subject; do
              if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
              number="${subject##*/}"
              [[ "$number" =~ ^[0-9]+$ ]] || { echo '::error::invalid ledger subject'; return 1; }
              exists=true
              case "$subject" in
                "https://github.com/$GITHUB_REPOSITORY/issues/$number"|"https://github.com/$GITHUB_REPOSITORY/pull/$number")
                  get "$GH_TOKEN" "repos/$GITHUB_REPOSITORY/issues/$number" "$work/thread.json" || return 1
                  case "$code" in 200) ;; 404|410) exists=false ;; *) echo '::error::thread audit read failed'; return 1 ;; esac ;;
                "https://github.com/$GITHUB_REPOSITORY/discussions/$number")
                  vars=$(jq -cn --arg owner "${GITHUB_REPOSITORY%/*}" --arg name "${GITHUB_REPOSITORY#*/}" --argjson number "$number" '{owner:$owner,name:$name,number:$number}')
                  # shellcheck disable=SC2016
                  if ! graph 'query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){discussion(number:$number){id}}}' "$vars" "$work/thread.json"; then
                    jq -e '(.errors|length)>0 and all(.errors[];.type=="NOT_FOUND")' "$work/thread.json" >/dev/null || { echo '::error::thread audit read failed'; return 1; }
                    exists=false
                  fi ;;
                *) echo '::error::ledger subject outside source'; return 1 ;;
              esac
              # The ledger has no comment ID: never guess that a missing marker was deleted.
              # Owner-accepted residuals are explicit in manual-markers-allowlist (§5.3).
              jq -cn --arg subject "$subject" --argjson exists "$exists" '{subject:$subject,exists:$exists,readable:$exists,marker_deleted:false}' >> "$work/threads.ndjson"
            done < "$work/subjects"
            jq -sn --arg source "$GITHUB_REPOSITORY" --slurpfile ledger "$ledger" \
              --slurpfile baseline "$work/baseline.json" --slurpfile collaborators "$work/collaborators.json" \
              --slurpfile invitations "$work/pending.json" --slurpfile markers "$work/markers.json" \
              --slurpfile threads "$work/threads.ndjson" --slurpfile manual "$work/manual-allowlist.json" \
              --slurpfile manual_markers "$work/manual-markers-allowlist.json" \
              '{source_repo:$source,ledger:$ledger,baseline:$baseline[0],collaborators:$collaborators[0],invitations:$invitations[0],invitations_status:200,markers:$markers[0],threads:$threads,manual_allowlist:$manual[0],manual_markers_allowlist:$manual_markers[0],complete:true}' > "$work/audit.json"
            divergences=$(jq -r --arg mode live '

              def success: .result|(.=="ok" or startswith("ok-") or startswith("already-") or .=="noop" or .=="expired");
              def closes: (.action|IN("revoke","would-revoke","cancel-invite","would-cancel-invite")) and success and .result!="expired";
              def ids: map(if type=="number" then . else .id end)|unique;
              def markkey: [.actor_id,.tier,.subject];
              . as $s | [.markers[]|select(.author=="github-actions[bot]")] as $markers |
              if $mode=="record-only" then
                (if (.collaborators|ids)!=(.baseline.collaborators|ids) then "reduced-collaborators: baseline differs" else empty end),
                (if .invitations_status!=403 then "reduced-probe: expected 403" else empty end),
                (if ($markers|length)>0 then "reduced-markers: workflow markers exist" else empty end)
              else
                # File-order duplicates cannot increase the closure count. Latest means ts,
                # with input order as the tie breaker for same-second action attempts.
                [.ledger|to_entries[]|.value+{_order:.key}|select(.repo==$s.source_repo)] as $ledger |
                ([$ledger|group_by(.actor_id)[]|
                  . as $history | (1+([$history[]|select(closes)|.run_id]|unique|length)) as $gen |
                  [$history[]|select(.gen==$gen)] as $current |
                  [$current[]|select(.action=="invite" and success)]|sort_by(.ts,._order)|last as $invite |
                  select($invite!=null) |
                  select(all($current[]; (.action!="cancel-invite" or .result!="expired") or ([.ts,._order] <= [$invite.ts,$invite._order]))) |
                  $invite.actor_id] | unique) as $predicted |
                ([.collaborators[].id,.invitations[].invitee.id]|unique) as $actual |
                ([.baseline.collaborators[].id,.baseline.invitations[].invitee.id]+(.manual_allowlist|ids)|unique) as $allowed |
                (($predicted-$actual)[]|"access: missing actor_id=\(.)"),
                (($actual-$predicted-$allowed)[]|"strangers: unexpected actor_id=\(.)"),
                [$ledger[]|select(.action=="comment" and success)] as $comments |
                ($markers[] as $m|select(all($comments[];.actor_id!=$m.actor_id or .tier!=$m.tier))|"markers-A: unledgered actor_id=\($m.actor_id) tier=\($m.tier) subject=\($m.subject)"),
                ($comments|unique_by(markkey)[] as $c|
                  [$s.threads[]|select(.subject==$c.subject)] as $thread |
                  if ($thread|length)==0 then "markers-B-state: absent thread evidence subject=\($c.subject)"
                  elif any($thread[];.exists and .readable and (.marker_deleted!=true)) and
                    all($markers[];markkey!=($c|markkey)) and
                    all($s.manual_markers_allowlist[];markkey!=($c|markkey))
                  then "markers-B: missing actor_id=\($c.actor_id) tier=\($c.tier) subject=\($c.subject)" else empty end)
              end
            ' "$work/audit.json")
            if [ -n "$divergences" ]; then
              while IFS= read -r divergence; do printf '::error::%s\n' "$divergence"; done <<< "$divergences"
                if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
              gate=false
            fi
            # §11(e), before any destructive call: recover own markers missing from the ledger.
            # This runs even if (a)/(d) is false, so a red run can be reconciled safely.
            printf '[]\n' > "$work/protected.json"
            while IFS= read -r actor_id; do
              if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
              [ "$(model "achieved(\"$GITHUB_REPOSITORY\";$actor_id)")" = 1 ] || continue
              jq -e --argjson id "$actor_id" 'index($id)!=null' <<< "$STARGAZERS" >/dev/null && continue
              gen=$(model "generation(\"$GITHUB_REPOSITORY\";$actor_id)")
              actor=$(model "[.[]|select(.repo==\"$GITHUB_REPOSITORY\" and .actor_id==$actor_id)]|sort_by(.ts)|last|.actor" | jq -r .)
              while IFS= read -r evidence; do
                if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
                tier=$(jq -r .tier <<< "$evidence"); subject=$(jq -r .subject <<< "$evidence")
                jq --argjson id "$actor_id" '.+[$id]|unique' "$work/protected.json" > "$work/protected-next.json"
                mv "$work/protected-next.json" "$work/protected.json"
                if ! jq -se -L "$work" --arg mode "$MODE" --argjson id "$actor_id" --argjson tier "$tier" --arg repo "$GITHUB_REPOSITORY" \
                  'include "model"; any(.[];.repo==$repo and .actor_id==$id and .tier==$tier and .action=="comment" and success)' "$ledger" >/dev/null; then
                  case "$subject" in
                    "https://github.com/$GITHUB_REPOSITORY/discussions/"*) event=discussion ;;
                    "https://github.com/$GITHUB_REPOSITORY/pull/"*) event=pull_request_target ;;
                    "https://github.com/$GITHUB_REPOSITORY/issues/"*) event=issues ;;
                    *) echo '::error::marker subject outside source'; gate=false; continue ;;
                  esac
                  # A recovered comment uses its original tier key, not a sweep closure key.
                  emit comment "already-$tier" "$tier" "$subject" "$event"; changed=true
                fi
              done < <(jq -c --argjson id "$actor_id" '.[]|select(.actor_id==$id)' "$work/markers.json")
            done < <(jq -r '.[]' "$work/ids.json")
            audit_complete=true
            # §11 step 4: ALL destructive effects are behind the combined (a)–(e) gate.
            if [ "$gate" = true ]; then
              # Defensive pending cancels queued at step 2 execute before unstar cleanup.
              while IFS= read -r queued; do
                if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
                actor_id=$(jq -r .actor_id <<< "$queued"); actor=$(jq -r .actor <<< "$queued"); gen=$(jq -r .gen <<< "$queued")
                invitation_id=$(jq -r .invitation_id <<< "$queued")
                jq -e --argjson id "$actor_id" 'index($id)!=null' "$work/protected.json" >/dev/null && continue
                printf '{}\n' > "$work/empty.json"
                mutate "$ADMIN_TOKEN" DELETE "repos/$REWARD_REPO/invitations/$invitation_id" "$work/empty.json"
                case "$code" in 200|204) result=ok; changed=true ;; *) result="error-$code"; failed=1 ;; esac
                emit cancel-invite "$result" 0 '' sweep || return 1
              done < "$work/cancel-queue.ndjson"
              while IFS= read -r actor_id; do
                if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
                [ "$(model "achieved(\"$GITHUB_REPOSITORY\";$actor_id)")" = 1 ] || continue
                jq -e --argjson id "$actor_id" 'index($id)!=null' <<< "$STARGAZERS" >/dev/null && continue
                jq -e --argjson id "$actor_id" 'index($id)!=null' "$work/protected.json" >/dev/null && continue
                gen=$(model "generation(\"$GITHUB_REPOSITORY\";$actor_id)")
                actor=$(model "[.[]|select(.repo==\"$GITHUB_REPOSITORY\" and .actor_id==$actor_id)]|sort_by(.ts)|last|.actor" | jq -r .)
                if ! identity; then emit revoke "error-$code" 0 '' sweep; failed=1; continue; fi
                # Match numeric IDs; resolving the current login prevents rename confusion (§11).
                if ! pages "$ADMIN_TOKEN" "repos/$REWARD_REPO/invitations?per_page=100" "$work/current-pending.json"; then
                  emit revoke error-preflight 0 '' sweep; failed=1; continue
                fi
                get "$ADMIN_TOKEN" "repos/$REWARD_REPO/collaborators/$actor" "$work/current-collaborator.json" || return 1
                pending=$(jq -c --argjson id "$actor_id" '[.[]|select(.invitee.id==$id)]' "$work/current-pending.json")
                case "$code" in
                  404)
                    if [ "$(jq length <<< "$pending")" = 0 ]; then result=noop
                    else
                      printf '{}\n' > "$work/empty.json"
                      mutate "$ADMIN_TOKEN" DELETE "repos/$REWARD_REPO/collaborators/$actor" "$work/empty.json"
                      case "$code" in 200|204|404) result=noop ;; *) result="error-$code"; failed=1 ;; esac
                    fi ;;
                  204)
                    printf '{}\n' > "$work/empty.json"
                    mutate "$ADMIN_TOKEN" DELETE "repos/$REWARD_REPO/collaborators/$actor" "$work/empty.json"
                    case "$code" in 200|204) result=ok ;; *) result="error-$code"; failed=1 ;; esac ;;
                  *) result="error-$code"; failed=1 ;;
                esac
                emit revoke "$result" 0 '' sweep || return 1
                case "$result" in error-*) continue ;; *) changed=true ;; esac
                # The pair deliberately shares the pre-closure gen and run_id: one closure (§7).
                while IFS= read -r invitation_id; do
                  if ! within_deadline; then [ "$audit_complete" = true ] && return 0; echo '::error::audit deadline exceeded'; return 1; fi
                  printf '{}\n' > "$work/empty.json"
                  mutate "$ADMIN_TOKEN" DELETE "repos/$REWARD_REPO/invitations/$invitation_id" "$work/empty.json"
                  case "$code" in 200|204) result=ok ;; 404) result=noop ;; *) result="error-$code"; failed=1 ;; esac
                  emit cancel-invite "$result" 0 '' sweep || return 1
                done < <(jq -r '.[].id' <<< "$pending")
              done < <(jq -r '.[]' "$work/ids.json")
            else
              echo '::error::sweep preconditions (a)-(e) failed; all API cleanup skipped'
              failed=1
            fi
          }
          gate="$SWEEP_GATE"
          budget_active=true
          if ! sweep_cleanup; then
            echo '::error::sweep recovery/audit incomplete; destructive work stopped'
            gate=false; failed=1
          fi
          budget_active=false
          # §11 step 4b: only (a)(b)(c), independently of cleanup/audit (d)(e).
          budget_active=true
          : > "$work/supporters-queue.ndjson"
          deferred_quota=false
          catchup_gate="$SWEEP_GATE"
          if ! jq -e 'type=="array" and all(.[]; type=="number" and .>0 and floor==.)' <<< "$STARGAZERS" >/dev/null; then catchup_gate=false; STARGAZERS='[]'; fi
          candidates_now() {
            jq -s -L "$work" --arg mode "$MODE" --arg repo "$GITHUB_REPOSITORY" --arg tiers "$TIERS_ENABLED" --argjson stars "$STARGAZERS" \
              'include "model"; catchup($repo;$stars;$tiers)' "$ledger"
          }
          queue_supporters() {
            reservedCount=$((reservedCount+1))
            line supporters-append ok 1 '' sweep >> "$work/supporters-queue.ndjson"
          }
          candidates_now > "$work/catchup.json"
          if [ "$catchup_gate" = true ]; then
            while IFS= read -r item; do
              work_budget 1 || break
              actor_id=$(jq -r .actor_id <<< "$item"); actor=$(jq -r .actor <<< "$item"); gen=$(jq -r .gen <<< "$item")
              queue_supporters
            done < <(jq -c '.[]|select(.invite and (.append|not))' "$work/catchup.json")
            while IFS= read -r item; do
              # PUT + invite line + optional append reservation; repairs already counted.
              needed=$(jq 'if .append then 2 else 3 end' <<< "$item")
              work_budget "$needed" || break
              if quota_room; then :; else
                [ "$?" -eq 1 ] || failed=1
                break
              fi
              actor_id=$(jq -r .actor_id <<< "$item"); actor=$(jq -r .actor <<< "$item"); gen=$(jq -r .gen <<< "$item")
              if [ "$(jq -r .exhausted <<< "$item")" = true ]; then emit skip excluded-unresponsive 0 '' sweep || failed=1; continue; fi
              if ! identity; then emit invite "error-$code" 1 '' sweep || failed=1; failed=1; continue; fi
              assoc=NONE
              if ! eligibility; then emit invite error-identity 1 '' sweep || failed=1; failed=1; continue; fi
              if [ -n "$reason" ]; then emit skip "$reason" 0 '' sweep || failed=1; continue; fi
              work_budget "$needed" || break
              invite true
              case "$result" in
                budget-stop) break ;;
                deferred-quota) deferred_quota=true; emit skip deferred-quota 0 '' sweep || failed=1; break ;;
                error-*) emit invite "$result" 1 '' sweep || failed=1; failed=1; continue ;;
                ok) result=ok-catchup ;;
              esac
              if ! emit invite "$result" 1 '' sweep; then failed=1; break; fi
              if [ "$(jq -r .append <<< "$item")" = false ]; then queue_supporters; fi
            done < <(jq -c '.[]|select(.invite|not)' "$work/catchup.json")
          else
            echo '::error::catch-up preconditions (a)(b)(c) failed; catch-up skipped'
            failed=1
          fi
          # §11 steps 5–8 always run, including after a red-run/audit gate failure.
          budget_active=false
          rotate || failed=1
          reservedCount=$((reservedCount-1))
          if regenerate "$(cat "$work/supporters-queue.ndjson")"; then projection_result=ok
          else projection_result="error-${code:-regenerate}"; failed=1; fi
          while IFS= read -r queued; do
            actor=$(jq -r .actor <<< "$queued"); actor_id=$(jq -r .actor_id <<< "$queued"); gen=$(jq -r .gen <<< "$queued")
            reservedCount=$((reservedCount-1))
            emit supporters-append "$projection_result" 1 '' sweep || failed=1
          done < "$work/supporters-queue.ndjson"
          reminder "$LEDGER_EXPIRES" 'ledger token'
          reminder "$ADMIN_EXPIRES" 'invitation token'
          reservedCount=$((reservedCount-1))
          sweep_state || { echo '::error::sweep state/summary failed'; failed=1; }
          [ "$failed" -eq 0 ] || { echo '::error::live sweep failed closed'; exit 1; }
      - name: Notify owner independently of ledger and delivery outcome
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          MODE: ${{ inputs.mode }}
          SWEEP: ${{ inputs.sweep }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # jq/GraphQL variables below are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          [ "$MODE" = live ] || exit 1
          work="$RUNNER_TEMP/supporter-loop"
          notify() {
            local text="$1" status
            [ "$MODE" = live ] || return 1
            if ! status=$(curl -sS --connect-timeout 10 --max-time 30 -o "$work/telegram.json" -w '%{http_code}' \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text"); then
              echo '::warning::Telegram transport failed'; return 0
            fi
            if [ "$status" != 200 ] || ! jq -e '.ok==true' "$work/telegram.json" >/dev/null; then echo '::warning::Telegram rejected owner notification'; fi
          }
          if [ "$SWEEP" = true ]; then
            if [ -f "$work/sweep-messages" ]; then
              while IFS= read -r text; do notify "$text"; done < "$work/sweep-messages"
            else
              notify "supporter-loop [live] $GITHUB_REPOSITORY · sweep · summary unavailable (failed)"
            fi
          elif [ -f "$work/notify.ndjson" ]; then
            while IFS= read -r entry; do
              case "$(jq -r .result <<< "$entry")" in already-*) continue ;; esac
              text=$(jq -r '"supporter-loop [\(.mode)] \(.repo) · \(.event) · @\(.actor) · tier \(.tier) · \(.action) · \(.result)" + (if .subject=="" then "" else "\n"+.subject end)' <<< "$entry")
              notify "$text"
            done < "$work/notify.ndjson"
          fi
          if [ -f "$work/reminders" ]; then
            while IFS= read -r reminder; do notify "supporter-loop [live] $GITHUB_REPOSITORY · $reminder"; done < "$work/reminders"
          fi
  alert:
    needs: [stars, decide, act]
    if: ${{ !cancelled() && failure() && inputs.mode == 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Send one live failure alert
        env:
          MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DECIDE_RESULT: ${{ needs.decide.result }}
          STARS_JOB_RESULT: ${{ needs.stars.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # jq/GraphQL variables below are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          [ "$MODE" = live ] || exit 1
          job=act
          [ "$DECIDE_RESULT" != failure ] || job=decide
          [ "$STARS_JOB_RESULT" != failure ] || job=stars
          text="supporter-loop FAILED $GITHUB_REPOSITORY · $job · $RUN_URL"
          [ "$MODE" = live ] || exit 1
          status=$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/supporter-loop-alert.json" -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text")
          if [ "$status" != 200 ] || ! jq -e '.ok==true' "$RUNNER_TEMP/supporter-loop-alert.json" >/dev/null; then echo '::error::failure notification failed'; exit 1; fi
