            local archive target_sha='' base_sha content status
            get "$LEDGER_TOKEN" "repos/$REWARD_REPO/contents/ledger/$base.ndjson" "$work/rotation-base.json" || return 1
            [ "$code" != 404 ] || return 0
            [ "$code" = 200 ] || return 1
            jq -jr '.content | @base64d' "$work/rotation-base.json" > "$work/rotation-base"
